name: Publish

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: packwiz-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
      
      - name: Setup packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Find previous tag
        id: previous_tag
        run: |
          previous_tag=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$previous_tag" ]; then
            echo "No previous tag found" && exit 1
          fi
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Create version
        id: version
        run: |
          year=$(date -u +'%y')
          month=$(date -u +'%-m')

          patch=$(git tag -l "${year}.${month}.*" | wc -l)
          version="${year}.${month}.${patch}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
      
      - name: Bump pack.toml version
        env:
          pack_version: ${{ steps.version.outputs.version }}
          previous_tag: ${{ steps.previous_tag.outputs.tag }}
        run: |
          find versions -type f -name 'pack.toml' -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            if [ -n "$previous_tag" ] && git diff --quiet "$previous_tag" HEAD -- "$dir"; then
              continue
            fi

            IFS='/' read -ra parts <<< "${filepath#versions/}"
            loader="${parts[0]}"
            mc_version="${parts[1]}"

            full_version="${pack_version}+mc${mc_version}.${loader}"
            sed -i -E "s/^version = .*/version = \"${full_version}\"/" "$filepath"
          done

      - name: Commit release
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: release ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.version }}
      
      - name: Export modpack
        run: scripts/export.sh
      
      - name: Release modpack
        if: github.ref == 'refs/heads/main'
        uses: Kira-NT/mc-publish@v3
        with:
          github-draft: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: bin/*
          version: ${{ steps.version.outputs.version }}
