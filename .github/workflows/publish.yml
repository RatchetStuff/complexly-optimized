name: Publish

on:
  workflow_dispatch:
    inputs:
        version:
          description: "Release version (e.g. 26.1.0)"
          required: true
          type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
      
      - name: Setup packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Find previous tag
        id: previous_tag
        run: |
          previous_tag=$(git tag --sort=-version:refname | head -n 1)
          if [ -z "$previous_tag" ]; then
            echo "No previous tag found" && exit 1
          fi
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
      
      - name: Bump pack.toml version
        env:
          tag: ${{ inputs.version }}
          previous_tag: ${{ steps.previous_tag.outputs.tag }}
        run: |
          find versions -type f -name "pack.toml" -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            if [ -n "$previous_tag" ] && git diff --quiet "$previous_tag" HEAD -- "$dir"; then
              continue
            fi

            IFS='/' read -ra parts <<< "${filepath#versions/}"
            loader="${parts[0]}"
            mc_version="${parts[1]}"

            full_version="${tag}+mc${mc_version}.${loader}"
            sed -i -E "s/^version = .*/version = \"${full_version}\"/" "$filepath"
          done

      - name: Commit release
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: release ${{ inputs.version }}"

      - name: Create tag
        if: github.ref == 'refs/heads/main'
        env:
          version: ${{ inputs.version }}
        run: |
          git tag "$version"
          git push origin "$version"
      
      - name: Export modpack
        if: github.ref == 'refs/heads/main'
        run: |
          bin_dir="$(git rev-parse --show-toplevel)/bin"
          mkdir -p "$bin_dir"
          find versions -type f -name "pack.toml" -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            distribution="$(basename "$dir")"
            (
              cd "$dir" || exit 1
              case "$distribution" in
                curseforge)
                  packwiz cf export
                  mv *.zip "$bin_dir"
                  ;;
                modrinth)
                  packwiz mr export
                  mv *.mrpack "$bin_dir"
                  ;;
                *)
                  echo "Unknown distribution: $distribution"
                  exit 1
                  ;;
              esac
            )
          done
      
      - name: Release modpack
        if: github.ref == 'refs/heads/main'
        uses: Kira-NT/mc-publish@v3
        with:
          github-draft: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: bin/*
          version: ${{ inputs.version }}
