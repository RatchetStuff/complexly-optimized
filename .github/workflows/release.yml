name: Release

on:
  workflow_dispatch:
    inputs:
        version:
          description: "Release version (e.g. 26.1.0)"
          required: true
          type: string

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Go
        uses: actions/setup-go@v7
      
      - name: Setup packwiz
        run: go install github.com/packwiz/packwiz@latest
      
      - name: Update mod versions
        run: |
          find versions -type f -name "pack.toml" -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            (
              cd "$dir" || exit 1
              packwiz update -ay
            )
          done
      
      - name: Refresh versions
        run: |
          find versions -type f -name "pack.toml" -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            (
              cd "$dir" || exit 1
              packwiz refresh
            )
          done
      
      - name: Commit updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update packs"
      
      - name: Find previous tag
        id: previous_tag
        run: |
          previous_tag=$(git describe --tags --abbrev=0 || true)
          echo "tag=$previous_tag" >> "$GITHUB_OUTPUT"
      
      - name: Bump pack.toml version
        env:
          tag: ${{ inputs.version }}
          previous_tag: ${{ steps.previous_tag.outputs.tag }}
        run: |
          find versions -type f -name "pack.toml" -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            if [ -n "$previous_tag" ] && git diff --quiet "$previous_tag" HEAD -- "$dir"; then
              continue
            fi

            IFS='/' read -ra parts <<< "${filepath#versions/}"
            mc_version="${parts[0]}"
            loader="${parts[1]}"
            flavor="${parts[2]}"

            full_version="${tag}+mc${mc_version}.${loader}.${flavor}"
            sed -i -E "s/^version = .*/version = \"${full_version}\"/" "$filepath"
          done

      - name: Commit release
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: release ${{ inputs.version }}"
      
      - name: Create tag
        env:
          version: ${{ inputs.version }}
        run: |
          git tag "$version"
          git push origin "$version"
      
      - name: Export modpack
        env:
          previous_tag: ${{ steps.previous_tag.outputs.tag }}
        run: |
          mkdir -p bin
          bin_dir="$(git rev-parse --show-toplevel)/bin"
          find versions -type f -name "pack.toml" -print0 | while IFS= read -r -d '' filepath; do
            dir=$(dirname "$filepath")
            if [ -n "$previous_tag" ] && git diff --quiet "$previous_tag" HEAD -- "$dir"; then
              continue
            fi
            distribution="$(basename "$dir")"
            (
              cd "$dir" || exit 1
              case "$distribution" in
                cf)
                  packwiz cf export
                  mv *.zip "$bin_dir"
                  ;;
                mr)
                  packwiz mr export
                  mv *.mrpack "$bin_dir"
                  ;;
                *)
                  echo "Unknown distribution: $distribution"
                  exit 1
                  ;;
              esac
            )
          done
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packs
          path: bin
      
      - name: Generate matrix
        id: matrix
        run: |
          matrix='{"include":['
          first=true
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            metadata="${filename#*+mc}"
            metadata="${metadata%.*}"
            IFS='.' read -r mc_version loader flavor <<< "$metadata"

            if [ "$first" = false ]; then
              matrix+=','
            fi
            first=false

            matrix+=$(jq -nc \
              --arg file "$file" \
              --arg minecraft "$mc_version" \
              --arg loader "$loader" \
              '{file:$file, minecraft:$minecraft, loader:$loader}')
          done < <(find bin -type f -print0)

          matrix+=']}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
    
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

  publish:
    needs: build

    runs-on: ubuntu-latest
    
    strategy:
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: packs
          path: bin
      
      - name: Release modpack
        uses: Kira-NT/mc-publish@v3
        with:
          version: ${{ inputs.version }}
          
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}

          github-files: ${{ matrix.file }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          modrinth-id: C5YzQQgW
          modrinth-files: ${{ endsWith(matrix.file, '.mrpack') && matrix.file || '' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}