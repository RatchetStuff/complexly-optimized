name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: packwiz-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-26.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: false
      
      - name: Setup packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Bump pack version
        id: bump
        shell: bash
        run: echo "version=$(scripts/update.sh)" >> "$GITHUB_OUTPUT"

      - name: Commit release
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update pack version"
          tag_name: ${{ steps.bump.outputs.version }}
      
      - name: Export modpack
        run: scripts/export.sh
      
      - name: Release modpack
        if: github.ref == 'refs/heads/main'
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: bin/*
          version: ${{ steps.bump.outputs.version }}
